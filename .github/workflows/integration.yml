name: integration

# Real API smoke tests. Never a pull-request gate: they need
# credentials, they touch a real person's health data, and they consume quota.
#
# Run this by hand after merging the version bump and before tagging. It used to run weekly, and
# that could not work. A consent screen with an external user type and a publishing status of
# "Testing" is *issued* a refresh token expiring in seven days — absolute from the moment it is
# granted, not a window that using it slides forward, and a refresh exchange returns only a new
# access token, so there is nothing to rotate either. No interval buys a credential that outlives
# the next re-consent. The schedule was therefore a red tick every Monday and a chore nobody had
# a reason to perform on any particular day. At release time the question is worth asking anyway,
# and the consent is fresh because somebody is already at the keyboard.
#
# This is the only check that reads what Google *does*. What it *says* — the Discovery document
# and the per-method reference pages — is watched by spec-check, which needs no credentials and
# still runs weekly. The gap this one covers is behaviour that changed while the documentation
# stood still.
#
# Note that the errors catalog defines API_PRIVATE_PREVIEW_ACCESS_DENIED, so this may not be
# runnable at all without Google-side allowlisting.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  smoke:
    name: real API smoke
    runs-on: ubuntu-latest
    environment: integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # An access token lives an hour, so one pasted into a secret stops working the same day. A
      # refresh token is what survives between runs, and minting from it here is the same exchange
      # GoogleOAuthClient.RefreshAsync performs. Done with curl so that the long-lived halves —
      # the refresh token and the client secret — stay inside this step. The hour-long access
      # token does go to the test process, because that is what it is for.
      #
      # Set GOOGLEHEALTH_REFRESH_TOKEN, GOOGLEHEALTH_CLIENT_ID and GOOGLEHEALTH_CLIENT_SECRET in
      # the "integration" environment. Given the seven-day ceiling described at the top of this
      # file, GOOGLEHEALTH_ACCESS_TOKEN is usually the honest choice: it expires in an hour, which
      # is long enough for a release and short enough that nobody mistakes it for a standing key.
      - name: Obtain an access token
        id: token
        env:
          REFRESH_TOKEN: ${{ secrets.GOOGLEHEALTH_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.GOOGLEHEALTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLEHEALTH_CLIENT_SECRET }}
          ACCESS_TOKEN: ${{ secrets.GOOGLEHEALTH_ACCESS_TOKEN }}
        run: |
          token="${ACCESS_TOKEN}"

          if [ -n "${REFRESH_TOKEN}" ] && [ -n "${CLIENT_ID}" ]; then
            # --data-urlencode, not -d. A refresh token or a client secret containing +, & or =
            # is sent verbatim by -d and means something else once the server parses the form,
            # which comes back as an unhelpful invalid_grant.
            response=$(curl -sS -X POST https://oauth2.googleapis.com/token \
              --data-urlencode "client_id=${CLIENT_ID}" \
              --data-urlencode "client_secret=${CLIENT_SECRET}" \
              --data-urlencode "refresh_token=${REFRESH_TOKEN}" \
              --data-urlencode "grant_type=refresh_token")

            minted=$(printf '%s' "$response" | python3 -c \
              'import json,sys; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)

            if [ -n "$minted" ]; then
              token="$minted"
            else
              # An allowlist, not the server's string. "The code, never the body" was not enough:
              # `error` is a field the server fills in too, so a token endpoint that echoed a
              # submitted value back would have put a refresh token into a public workflow log —
              # and a value containing :: could forge a workflow command besides.
              reported=$(printf '%s' "$response" | python3 -c \
                'import json,sys; print(json.load(sys.stdin).get("error",""))' 2>/dev/null || true)

              case "$reported" in
                invalid_request|invalid_client|invalid_grant) code="$reported" ;;
                unauthorized_client|unsupported_grant_type|invalid_scope) code="$reported" ;;
                *) code="an error code this workflow does not recognise" ;;
              esac

              echo "::warning::Refreshing the access token failed: ${code}"
            fi
          fi

          # Masked before it is used, so nothing downstream can print it by accident.
          if [ -n "$token" ]; then
            echo "::add-mask::${token}"
            echo "token=${token}" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Every run of this workflow is now somebody deciding to ask the question, so a skip is a
      # non-answer rather than a polite no-op — and a non-answer read as a pass is how a check
      # stops being one. This repository has already made that mistake once, back when a
      # credential-less scheduled run reported success.
      #
      # A fork without the secrets gets a red tick here. That is the correct answer to a
      # deliberate dispatch: the error below says what is missing.
      - name: Require credentials
        if: steps.token.outputs.present != 'true'
        run: |
          echo "::error::No usable credential, so the live check cannot run and is failing rather" \
               "than reporting a pass it did not earn. Set GOOGLEHEALTH_ACCESS_TOKEN, or the" \
               "refresh-token trio, in the 'integration' environment." >&2
          exit 1

      - name: Run integration tests
        id: tests
        env:
          GOOGLEHEALTH_ACCESS_TOKEN: ${{ steps.token.outputs.token }}
        run: dotnet test tests/Kkdev92.HealthData.IntegrationTests -c Release --filter "Category=Integration"

      # So that "when did this last actually reach Google?" has an answer that is not inferred from
      # a green tick. Keyed on the tests having passed rather than on a credential existing: the
      # tests are the only thing here that makes a Health API request, so a token that was minted
      # and then never used would otherwise have been recorded as a live check.
      - name: Record what this run proved
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ] && [ "${{ steps.token.outputs.present }}" = "true" ]; then
            echo "Live API reached at $(date -u +'%Y-%m-%dT%H:%M:%SZ')." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.token.outputs.present }}" != "true" ]; then
            echo "No credential: the live API was **not** contacted by this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The tests did not pass, so this run proves nothing about the live API." >> "$GITHUB_STEP_SUMMARY"
          fi
