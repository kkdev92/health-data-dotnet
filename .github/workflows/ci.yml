name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Declared explicitly so the repository default can be tightened to read-only.
# An explicit declaration overrides the default, so narrowing the default cannot break this.
permissions:
  contents: read

# Supersede a run when the same branch is pushed again. The other repositories in this
# account do the same. Safe here because every job is a check: nothing it cancels had
# side effects worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  # Refuses a pull request that introduces a dependency with a known vulnerability, or one whose
  # licence is not compatible with shipping under MIT. Dependabot reports what is already here;
  # this is the half that stops it arriving. Free on public repositories.
  #
  # Only meaningful on a pull request, where there are two commits to compare.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to leave the summary as a comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Anything that would actually be exploitable in a consumer's application. Low and
          # moderate still appear in the summary; they do not block, because a wall of advisories
          # nobody can act on is how a gate gets switched off.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # The core package ships with no third-party runtime dependencies, so a copyleft licence
          # appearing at all is a change worth stopping on rather than discovering at release.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0

  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Actions cache is free on public repositories, 10 GB per repository, evicted after seven
      # days unused. Keyed on the manifests that decide the restore graph, with no restore-keys:
      # a near-miss that seeded this folder from a different dependency set would quietly change
      # what the build resolves.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}

      - name: Restore
        run: dotnet restore HealthData.slnx

      - name: Build
        run: dotnet build HealthData.slnx -c Release --no-restore

      # Real-API tests never gate a pull request. They live in integration.yml, which is manual.
      # The integration project is not excluded here, and must not be: under Microsoft.Testing
      # .Platform an assembly that matches no tests fails the run rather than printing a note, so
      # filtering it out would turn it red. It is included and skips itself for want of a
      # credential, which also means a break in that project surfaces here rather than at release.
      - name: Test
        run: dotnet test --solution HealthData.slnx -c Release --no-build -- --filter-not-trait Category=Package

      # Regenerating from the committed snapshot must reproduce the checked-in sources byte for
      # byte. Running it on both operating systems is deliberate: it is the canary for
      # line-ending and path-separator drift, which only ever shows up cross-platform.
      - name: Verify generated sources
        run: dotnet run --project tools/Kkdev92.HealthData.CodeGen -c Release --no-build -- verify --version v4

      # Formatting is part of the contract, not a preference: generated sources are compared
      # byte for byte, so a stray reformat would show up as a spurious diff.
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format HealthData.slnx --verify-no-changes

      # NuGetAudit already fails restore on a vulnerable package. This lane reports transitive
      # advisories that do not meet the failure threshold, so they are visible before they bite.
      - name: Report vulnerable packages
        if: matrix.os == 'ubuntu-latest'
        run: dotnet list HealthData.slnx package --vulnerable --include-transitive

      - name: Pack
        run: dotnet pack HealthData.slnx -c Release --no-build -o artifacts

      # Runs against the packed output, so it has to follow Pack rather than join the main test
      # step. .gitignore has no bearing on what gets packed; this is what actually enforces it.
      # This lane also builds and runs a consumer that has only the packages, which is the one
      # thing a ProjectReference can never tell us.
      - name: Verify the packages
        run: dotnet test --project tests/Kkdev92.HealthData.Tests -c Release --no-build -- --filter-trait Category=Package

      # The AOT smoke above references the projects, so it would keep passing if the packages
      # stopped carrying what a consumer's own AOT publish needs. This one has only the nupkgs, and
      # source mapping so those ids cannot quietly be satisfied from anywhere else.
      - name: Native AOT from the packages alone
        if: matrix.os == 'ubuntu-latest'
        run: |
          version=$(ls artifacts/Kkdev92.HealthData.[0-9]*.nupkg | head -1             | sed 's|.*/Kkdev92[.]HealthData[.]||; s|[.]nupkg$||')

          echo "Building an AOT consumer against ${version}"

          mkdir -p "${RUNNER_TEMP}/aot-consumer"
          cd "${RUNNER_TEMP}/aot-consumer"

          cat > nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="artifacts" value="${GITHUB_WORKSPACE}/artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="artifacts"><package pattern="Kkdev92.HealthData*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

          cat > Consumer.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <PublishAot>true</PublishAot>
              <TrimmerSingleWarn>false</TrimmerSingleWarn>
              <JsonSerializerIsReflectionEnabledByDefault>false</JsonSerializerIsReflectionEnabledByDefault>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Kkdev92.HealthData" Version="${version}" />
              <PackageReference Include="Kkdev92.HealthData.Authentication" Version="${version}" />
              <PackageReference Include="Kkdev92.HealthData.DependencyInjection" Version="${version}" />
              <PackageReference Include="Kkdev92.HealthData.Webhooks" Version="${version}" />
            </ItemGroup>
          </Project>
          EOF

          cat > Program.cs <<'EOF'
          using Kkdev92.HealthData;
          using Kkdev92.HealthData.DependencyInjection;
          using Kkdev92.HealthData.Webhooks;
          using Microsoft.Extensions.DependencyInjection;

          var services = new ServiceCollection();
          services.AddHealthDataAccessToken("ya29.token");
          services.AddHealthData();

          using var provider = services.BuildServiceProvider();
          using var scope = provider.CreateScope();

          Console.WriteLine(scope.ServiceProvider.GetRequiredService<HealthDataClient>().Users is not null);
          Console.WriteLine(HealthDataApiMetadata.DefaultBaseAddress);
          Console.WriteLine(HealthDataWebhookKeyProvider.DefaultKeysetUri.Host);
          Console.WriteLine(HealthDataScopes.ProfileReadonly);
          Console.WriteLine("package-only AOT ok");
          EOF

          NUGET_PACKAGES="${RUNNER_TEMP}/aot-cache" dotnet publish -c Release -o out
          ./out/Consumer | tee result.txt
          grep -q "package-only AOT ok" result.txt

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  aot-smoke:
    name: native aot smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Actions cache is free on public repositories, 10 GB per repository, evicted after seven
      # days unused. Keyed on the manifests that decide the restore graph, with no restore-keys:
      # a near-miss that seeded this folder from a different dependency set would quietly change
      # what the build resolves.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}

      # A library that merely builds is not evidence of AOT compatibility; a consumer
      # application has to publish. CI is the gate for this, because a local Windows checkout
      # needs the MSVC linker on PATH.
      - name: Publish AOT smoke app
        run: >
          dotnet publish tests/Kkdev92.HealthData.AotSmokeTests/Kkdev92.HealthData.AotSmokeTests.csproj
          -c Release -p:PublishAot=true -o artifacts/aot

      - name: Run AOT smoke app
        shell: bash
        run: |
          if [ -f artifacts/aot/Kkdev92.HealthData.AotSmokeTests.exe ]; then
            ./artifacts/aot/Kkdev92.HealthData.AotSmokeTests.exe
          else
            ./artifacts/aot/Kkdev92.HealthData.AotSmokeTests
          fi

  # Detects a Google-side contract change without touching the committed snapshot.
  # Reports only: fetch and regeneration stay a reviewed, human-initiated action.
  spec-drift:
    name: spec drift (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Diff committed snapshot against the live Discovery document
        run: dotnet run --project tools/Kkdev92.HealthData.CodeGen -c Release -- diff --version v4
