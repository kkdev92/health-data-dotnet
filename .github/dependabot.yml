version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-dependencies:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
      # Microsoft.Extensions.Http requires Microsoft.Extensions.Options at no lower than its own
      # version, and both are pinned in Directory.Packages.props. One pull request for the pair
      # keeps an Options-only bump from competing with the Http bump that raises it anyway.
      microsoft-extensions-http:
        patterns:
          - "Microsoft.Extensions.Http"
          - "Microsoft.Extensions.Options"
    ignore:
      # Microsoft.Extensions.Http and .Options are direct references of the
      # DependencyInjection package, so the versions pinned for them become the
      # dependency lower bounds in its nuspec. A major update would raise every
      # consumer to the newer Microsoft.Extensions packages, apps still on .NET 10
      # included, while the packages target net10.0 only.
      #
      # Remove this when net11.0 joins the target frameworks. Minor and patch updates
      # still flow, as one pull request for the pair.
      - dependency-name: "Microsoft.Extensions.Http"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Options"
        update-types: ["version-update:semver-major"]
    # Core must keep zero third-party runtime dependencies.
    # Any bot PR that adds a package reference to src/Kkdev92.HealthData is wrong by
    # construction and must be closed rather than merged.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
